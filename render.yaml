services:
  - type: web
    name: ghost
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npx convex deploy --cmd-url-env-var-name VITE_CONVEX_URL --cmd 'npm run build'
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: HOST
        value: 0.0.0.0
      - key: RELAY_ONLY
        value: "true"
      # Metered → TURN Server → Credentials. Render asks for these when the Blueprint is created.
      - key: TURN_URLS
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_PASSWORD
        sync: false
      # Convex dashboard → production deployment → Settings → Generate Production Deploy Key. The build pushes convex/ and bakes the URL into the bundle.
      - key: CONVEX_DEPLOY_KEY
        sync: false
      # https://<deployment>.convex.cloud, used by the server to check Community sessions.
      - key: CONVEX_URL
        sync: false
